<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduChunks Editor Iframe</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-groups">
      <div class="toolbar-group">
        <button id="btn-bold" class="tool-btn" title="Bold (Ctrl+B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
            <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
          </svg>
        </button>
        <button id="btn-italic" class="tool-btn" title="Italic (Ctrl+I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="4" x2="10" y2="4"/>
            <line x1="14" y1="20" x2="5" y2="20"/>
            <line x1="15" y1="4" x2="9" y2="20"/>
          </svg>
        </button>
        <button id="btn-strike" class="tool-btn" title="Strikethrough">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <path d="M16 4H9a4 4 0 0 0-4 4 4 4 0 0 0 4 4h6a4 4 0 0 1 4 4 4 4 0 0 1-4 4H7"/>
          </svg>
        </button>
      </div>
      
      <div class="divider"></div>
      
      <div class="toolbar-group">
        <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6"/>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
          </svg>
        </button>
        <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 7v6h-6"/>
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="editor-meta">
      <div id="sync-latency" class="status-badge" style="display: none; border-color: rgba(59, 130, 246, 0.2); color: #3b82f6;">
        <span id="sync-latency-text">0ms sync</span>
      </div>
      <div id="wpm-badge" class="status-badge" style="display: none; border-color: rgba(245, 158, 11, 0.2); color: #f59e0b;">
        <span id="wpm-text">0 WPM</span>
      </div>
      <div id="sync-status" class="status-badge">
        <div class="status-dot"></div>
        <span id="sync-status-text">Connected</span>
      </div>
    </div>
  </div>
  
  <div class="editor-container">
    <div id="editor" class="editor-content" contenteditable="true" data-placeholder="Start typing your rich text here..."></div>
  </div>
  
  <div class="word-count">
    <span id="char-count">0 characters</span>
    <span id="words-count">0 words</span>
  </div>

  <script src="editor.js"></script>
</body>
</html>
